[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "remxr42"
version = "1.0.0"
description = "Teenage Engineering inspired Dual Circular Polar Vinyl DJ Workstation"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "remxr42 Team" }
]
requires-python = ">=3.9"
dependencies = [
    "streamlit>=1.35.0",
    "numpy>=1.22.0",
    "scipy>=1.9.0",
    "pillow>=9.0.0",
    "soundfile>=0.12.0",
    "yt-dlp>=2023.7.6",
]

[project.scripts]
remxr42 = "remxr42.cli:main"

[project.urls]
Homepage = "https://github.com/remxr42/remxr42"

[tool.setuptools.packages.find]
where = ["src"]
